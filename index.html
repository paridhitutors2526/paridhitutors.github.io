   ===================================================== */

#welcome-screen {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:

            circle at 20% 20%,
            rgba(99,102,241,.35),
            transparent 30%

        radial-gradient(
            circle at 80% 30%,
            rgba(14,165,233,.30),
            transparent 30%

            circle at 50% 90%,
            rgba(168,85,247,.25),
            transparent 35%

        #080d20;

    color: white;

    animation:
        welcomeFadeOut 1s ease 5s forwards;
}


.welcome-content {

    position: relative;

    z-index: 5;

    text-align: center;

    padding: 30px;

    animation: welcomeZoom 1.3s ease;
}


.welcome-logo {

    width: 125px;

    height: 125px;

    object-fit: contain;

    border-radius: 25px;

    margin-bottom: 22px;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.65))

    animation:
        logoAppear 1s ease,
        logoGlow 2s ease-in-out infinite alternate;
}

    font-size: 15px;

    letter-spacing: 5px;

    font-weight: 700;

    color: #c7d2fe;

    margin-bottom: 12px;
}


.welcome-title {

    font-size: clamp(42px,7vw,78px);

    line-height: 1.05;

        linear-gradient(
            90deg,
            #ffffff,
            #c7d2fe,
            #ffffff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 25px rgba(255,255,255,.25);

    animation: titleAppear 1.2s ease;
}


.welcome-tagline {

    margin-top: 18px;

    font-size: 18px;

    color: #cbd5e1;

    animation: taglineAppear 1.5s ease;

    font-weight: 700;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition: .3s ease;
}

    background: white;

    color: #312e81;

    transform: translateY(-3px);

    box-shadow:
        0 10px 30px rgba(255,255,255,.2);
}
