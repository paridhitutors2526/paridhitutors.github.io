/* =====================================================
   BASIC RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

    margin: 0;
    font-family: Arial, Helvetica, sans-serif;

/* =====================================================
   WELCOME / SPLASH SCREEN
   ===================================================== */

#welcome-screen {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(99,102,241,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(14,165,233,.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(168,85,247,.25),
            transparent 35%
        ),
        #080d20;

    color: white;

    animation:
        welcomeFadeOut 1s ease 5s forwards;
}


/* Welcome content */

.welcome-content {

    position: relative;

    z-index: 5;

    text-align: center;

    padding: 30px;

    animation: welcomeZoom 1.3s ease;
}


/* Welcome logo */

.welcome-logo {

    width: 125px;

    height: 125px;

    object-fit: contain;

    border-radius: 25px;

    margin-bottom: 22px;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.65))
        drop-shadow(0 0 30px rgba(99,102,241,.75));

    animation:
        logoAppear 1s ease,
        logoGlow 2s ease-in-out infinite alternate;
}


/* Welcome small text */

.welcome-small {

    font-size: 15px;

    letter-spacing: 5px;

    font-weight: 700;

    color: #c7d2fe;

    margin-bottom: 12px;
}


/* Welcome title */

.welcome-title {

    margin: 0;

    font-size: clamp(42px,7vw,78px);

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c7d2fe,
            #ffffff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 25px rgba(255,255,255,.25);

    animation: titleAppear 1.2s ease;
}


/* Tagline */

.welcome-tagline {

    margin-top: 18px;

    font-size: 18px;

    letter-spacing: 3px;

    color: #cbd5e1;

    animation: taglineAppear 1.5s ease;
}


/* Enter button */

.welcome-button {

    margin-top: 30px;

    border: 1px solid rgba(255,255,255,.35);

    background: rgba(255,255,255,.12);

    color: white;

    padding: 14px 28px;

    border-radius: 50px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition: .3s ease;
}

.welcome-button:hover {

    background: white;

    color: #312e81;

    transform: translateY(-3px);

    box-shadow:
        0 10px 30px rgba(255,255,255,.2);
}


/* =====================================================
   SPARKLES
   ===================================================== */

.sparkle {

    position: absolute;

    width: 5px;

    height: 5px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 8px white,
        0 0 18px #c7d2fe;

    opacity: 0;

    animation:
        sparkleAnimation linear infinite;
}


.sparkle::before,
.sparkle::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;
}


.sparkle::before {

    width: 2px;

    height: 22px;
}


.sparkle::after {

    width: 22px;

    height: 2px;
}


/* Sparkle positions */

.sparkle:nth-child(1) {
    left: 8%;
    top: 20%;
    animation-duration: 2.5s;
}

.sparkle:nth-child(2) {
    left: 18%;
    top: 70%;
    animation-duration: 3.2s;
}

.sparkle:nth-child(3) {

    top: 15%;
    animation-duration: 2.1s;
}

.sparkle:nth-child(4) {

}

}

.sparkle:nth-child(6) {

}

}

.sparkle:nth-child(8) {
    left: 90%;
